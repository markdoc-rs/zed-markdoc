# CI for zed-markdoc — https://github.com/markdoc-rs/zed-markdoc
#
# The gate itself is in `.github/scripts/check.sh`, not here, so release.yml
# runs exactly the same set before it publishes anything. A second list of
# steps drifts, and the half that drifts is always the one nobody watches.
#
# Zed loads extensions as WebAssembly components, so the build output is a
# single host-independent `zed_markdoc.wasm`. There is no per-OS or per-arch
# artifact to produce here the way there is for the `markdoc-ls` binary this
# extension launches — the extension only locates that binary, it does not
# bundle it.
#
# The matrix below is therefore a matrix of *build hosts*, not of targets: it
# proves a contributor on any supported platform can build the extension.
# Every host emits a component for the same target, though not byte-for-byte
# the same file: the wasm embeds the builder's cargo registry paths. (No
# Intel macOS host is listed: the `macos-13` image is retired.)
#
# What check.sh proves about the component — that it is a component at all,
# and that Zed can read its API version — does not depend on the build host,
# so it is checked once there rather than five times here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  WASM_TARGET: wasm32-wasip2

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # fmt, the lockfile, clippy for the wasm target, extension.toml
      # agreeing with Cargo.toml, the release build, and that what came out
      # is a component Zed can load.
      - name: check.sh
        run: bash .github/scripts/check.sh .

  build:
    name: Build on ${{ matrix.host }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: linux-x86_64
          - os: ubuntu-24.04-arm
            host: linux-aarch64
          - os: macos-latest
            host: macos-aarch64
          - os: windows-latest
            host: windows-x86_64
          - os: windows-11-arm
            host: windows-aarch64
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.host }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the wasm component
        shell: bash
        run: cargo build --locked --release --target "$WASM_TARGET"

      # Host-specific: that this host's toolchain emitted a wasm module at
      # all. What the module *is* is check.sh's business, once.
      - name: Check the component was produced
        shell: bash
        run: |
          set -euo pipefail
          wasm="target/$WASM_TARGET/release/zed_markdoc.wasm"
          test -s "$wasm"
          # A wasm binary starts with the "\0asm" magic number. This guards
          # against a build that silently emitted something else.
          magic=$(head -c 4 "$wasm" | od -An -tx1 | tr -d ' \n')
          if [[ "$magic" != "0061736d" ]]; then
            echo "error: $wasm is not a wasm module (magic: $magic)" >&2
            exit 1
          fi
          ls -lh "$wasm"
