# CI for zed-markdoc
#
# Zed loads extensions as WebAssembly components, so the build output is a
# single host-independent `zed_markdoc.wasm`. There is no per-OS or per-arch
# artifact to produce here the way there is for the `markdoc-ls` binary this
# extension launches — the extension only locates that binary, it does not
# bundle it.
#
# The matrix below is therefore a matrix of *build hosts*, not of targets: it
# proves a contributor on any supported platform can build the extension.
# Every host emits a component for the same target, though not byte-for-byte
# the same file: the wasm embeds the builder's cargo registry paths. (No
# Intel macOS host is listed: the `macos-13` image is retired.)
#
# clippy and build pass `--target wasm32-wasip2` (rustfmt has no target),
# because that is the target Zed loads. The crate also compiles for the host
# — `cargo check` with no target succeeds — but a host build is not the
# component Zed runs, so it proves nothing about it. In the markdoc-tools
# workspace this crate came from it was not a workspace member, so its gate
# built it but never ran rustfmt or clippy over it, and it was found
# unformatted; the `lint` job is what keeps that from recurring.
#
# `--locked` everywhere cargo resolves: Cargo.lock is committed, and a build
# that quietly re-resolved it would not be the build that was reviewed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  WASM_TARGET: wasm32-wasip2

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --target "$WASM_TARGET" -- -D warnings

  manifest:
    name: Validate extension.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # extension.toml is the version Zed shows and resolves; Cargo.toml is
      # the version cargo builds. The release gate this repository was split
      # out of checked the two against each other, and this is that check.
      - name: Check the manifest parses and agrees with Cargo.toml
        run: python3 -I .github/scripts/check_extension_manifest.py

  build:
    name: Build on ${{ matrix.host }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: linux-x86_64
          - os: ubuntu-24.04-arm
            host: linux-aarch64
          - os: macos-latest
            host: macos-aarch64
          - os: windows-latest
            host: windows-x86_64
          - os: windows-11-arm
            host: windows-aarch64
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.host }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the wasm component
        shell: bash
        run: cargo build --locked --release --target "$WASM_TARGET"

      - name: Check the component was produced
        shell: bash
        run: |
          set -euo pipefail
          wasm="target/$WASM_TARGET/release/zed_markdoc.wasm"
          test -s "$wasm"
          # A wasm binary starts with the "\0asm" magic number. This guards
          # against a build that silently emitted something else.
          magic=$(head -c 4 "$wasm" | od -An -tx1 | tr -d ' \n')
          if [[ "$magic" != "0061736d" ]]; then
            echo "error: $wasm is not a wasm module (magic: $magic)" >&2
            exit 1
          fi
          ls -lh "$wasm"

      # The magic number says "wasm"; Zed asks for more. It loads a component,
      # not a core module, and reads its API version from a `zed:api-version`
      # custom section before anything else — see the script. The Windows
      # images are skipped only because `python3` is not reliably on their
      # PATH; what this checks does not depend on the build host.
      - name: Check Zed can load the component
        if: runner.os != 'Windows'
        run: python3 -I .github/scripts/check_wasm_component.py "target/$WASM_TARGET/release/zed_markdoc.wasm"
