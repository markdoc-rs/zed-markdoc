# Release workflow for zed-markdoc — https://github.com/markdoc-rs/zed-markdoc
#
# ## How a release happens
#
# Cargo.toml's version is the release, as it is in every sibling repository.
# A push to main that changes Cargo.toml or extension.toml runs this, and
# when no tag names that version yet it checks the commit, builds the
# component, and creates the GitHub release and the tag with it. A version a
# tag already names does nothing; one older than the newest tag fails the run
# (.github/scripts/release_version.py says why). "Run workflow" does the same
# on demand, to retry a release that failed. A version with a pre-release
# part, 0.2.0-rc.1, makes a pre-release, so `releases/latest` stays on the
# last full release.
#
# This replaced a tag-driven release. A pushed tag was one more thing to get
# right by hand, and the two manifests and the tag could disagree three ways;
# now the version is read from Cargo.toml, check.sh holds extension.toml to
# it, and the tag is made from the same answer.
#
# ## What it publishes
#
# A Zed extension is a single WebAssembly component, so unlike the
# `markdoc-ls` release — one bare binary per platform — there is one artifact
# here: the same wasm runs on every platform Zed does. It is built once,
# recorded with a GitHub build-provenance attestation, and published together
# with the manifest and a SHA256SUMS file.
#
# The archive is installable as it stands. Unpacked, `zed-markdoc-<version>/`
# holds `extension.toml` and the component as `extension.wasm`; point Zed's
# "Install Dev Extension" at that directory. With no Cargo.toml there, Zed
# compiles nothing, finds `extension.wasm` and loads it as the extension (Zed
# v1.27.0: `ExtensionManifest::populate_defaults` and
# `ExtensionStore::add_extension_to_index`), so a writer needs no Rust
# toolchain. cargo names the file after the crate; Zed looks for
# `extension.wasm`, hence the rename below. The loose `zed_markdoc.wasm` is
# the same bytes under cargo's name.
#
# Verify a downloaded archive with:
#
#   gh attestation verify zed-markdoc-<version>.tar.gz --repo markdoc-rs/zed-markdoc
#
# ## What it does not publish
#
# Zed's registry is https://github.com/zed-industries/extensions, which
# builds the wasm itself from the commit its submodule of this repository
# points at; publishing there means a PR that bumps that submodule and the
# version in its `extensions.toml`. See
# https://zed.dev/docs/extensions/developing-extensions for that flow.

name: Release

on:
  push:
    branches: [main]
    paths: [Cargo.toml, extension.toml]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time: two runs deciding at once could both find the
# version untagged.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  WASM_TARGET: wasm32-wasip2

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Only main releases
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::${GITHUB_REF} is not main, and only main is released." >&2
          exit 1

      - uses: actions/checkout@v5

      - name: Cargo.toml's version, and whether a tag names it yet
        id: version
        run: python3 -I .github/scripts/release_version.py .

  # ────────────────────────────────────────────────────────────────────
  # Nothing is published until this passes. Same check.sh ci.yml runs, so
  # a release cannot hold a build the ordinary gate would have rejected —
  # including that extension.toml's version agrees with Cargo.toml's.
  # ────────────────────────────────────────────────────────────────────
  check:
    name: Check
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-check

      - name: check.sh
        run: bash .github/scripts/check.sh .

  release:
    name: Build, attest and publish
    needs: [version, check]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating the release and its tag
      id-token: write # provenance signing
      attestations: write # recording the attestation
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Build the wasm component
        run: cargo build --locked --release --target "$WASM_TARGET"

      - name: Stage archive
        id: stage
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          asset="zed-markdoc-${VERSION}"
          mkdir -p "staging/$asset" dist
          cp "target/$WASM_TARGET/release/zed_markdoc.wasm" "staging/$asset/extension.wasm"
          cp extension.toml README.md LICENSE "staging/$asset/"
          tar czf "dist/$asset.tar.gz" -C staging "$asset"
          listing=$(tar tzf "dist/$asset.tar.gz")
          printf '%s\n' "$listing"
          # Fail here rather than in a writer's editor: these two are what
          # "Install Dev Extension" needs to find in the unpacked directory.
          # (The listing is read once, into a variable: piping `tar` into
          # `grep -q` under pipefail fails whenever grep stops reading first.)
          for f in extension.toml extension.wasm; do
            grep -qx "$asset/$f" <<<"$listing" || {
              echo "error: dist/$asset.tar.gz has no $asset/$f" >&2
              exit 1
            }
          done
          echo "name=$asset.tar.gz" >> "$GITHUB_OUTPUT"

      # Attests both the archive and the bare wasm: the archive is what a
      # person downloads, and the wasm is what actually gets loaded.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/${{ steps.stage.outputs.name }}
            target/${{ env.WASM_TARGET }}/release/zed_markdoc.wasm

      - name: Collect the loose wasm and checksum everything
        run: |
          set -euo pipefail
          cp "target/$WASM_TARGET/release/zed_markdoc.wasm" dist/
          cd dist
          sha256sum zed_markdoc.wasm *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: zed-markdoc-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      # The tag is made here, on this commit, from the version that was
      # decided: nothing pushes a tag by hand any more.
      - name: Create the release, and its tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ needs.version.outputs.prerelease }}
